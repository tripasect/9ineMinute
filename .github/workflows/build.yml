name: Build Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: 9ineMinuteEnglish-Windows.exe
            ffmpeg_url: https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-full_build.zip
            ffmpeg_bin_dir: ffmpeg-7.1-full_build/bin
          - os: macos-latest
            artifact_name: 9ineMinuteEnglish-macOS

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up FriBiDi for Windows native RTL text
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-fribidi

      - name: Stage Windows FriBiDi runtime DLL
        if: matrix.os == 'windows-latest'
        run: cp /mingw64/bin/libfribidi-0.dll .
        shell: msys2 {0}

      - name: Install macOS text-rendering dependency
        if: matrix.os == 'macos-latest'
        run: |
          brew install libraqm ffmpeg
          # Copy fribidi dylib directly from known location
          cp "$(brew --prefix fribidi)/lib/libfribidi.0.dylib" libfribidi.dylib

      - name: Stage macOS FFmpeg binaries
        if: matrix.os == 'macos-latest'
        run: |
          ffmpeg_bin="$(brew --prefix ffmpeg)/bin"
          for tool in ffmpeg ffplay ffprobe; do
            test -x "$ffmpeg_bin/$tool"
            cp "$ffmpeg_bin/$tool" .
            "$tool" -version | head -n 1
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Download FFmpeg (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -L -o ffmpeg.zip ${{ matrix.ffmpeg_url }}
          expand-archive ffmpeg.zip .
          copy-item ${{ matrix.ffmpeg_bin_dir }}/ffmpeg.exe .
          copy-item ${{ matrix.ffmpeg_bin_dir }}/ffplay.exe .
          copy-item ${{ matrix.ffmpeg_bin_dir }}/ffprobe.exe .
        shell: pwsh

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec

      - name: Verify frozen native RTL rendering (Windows)
        if: matrix.os == 'windows-latest'
        run: .\dist\9ineMinuteEnglish.exe --verify-raqm
        shell: pwsh

      - name: Prepare Artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv dist/9ineMinuteEnglish.exe ${{ matrix.artifact_name }}

      - name: Prepare Artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # For macOS, we provide both the raw binary and the .app bundle (zipped)
          mv dist/9ineMinuteEnglish ${{ matrix.artifact_name }}
          cd dist && zip -r ../9ineMinuteEnglish-macOS-App.zip 9ineMinuteEnglish.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            9ineMinuteEnglish-macOS-App.zip

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*" | sort

      - name: Prepare release files
        run: |
          # Move files to flat structure for release
          mkdir -p release-files
          cp artifacts/9ineMinuteEnglish-Windows.exe/9ineMinuteEnglish-Windows.exe release-files/
          cp artifacts/9ineMinuteEnglish-macOS/9ineMinuteEnglish-macOS release-files/
          cp artifacts/9ineMinuteEnglish-macOS/9ineMinuteEnglish-macOS-App.zip release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/9ineMinuteEnglish-Windows.exe
            release-files/9ineMinuteEnglish-macOS
            release-files/9ineMinuteEnglish-macOS-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
